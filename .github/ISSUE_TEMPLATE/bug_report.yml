name: Bug report
description: Report reproducible behavior in PromptGod-Go.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Share only a minimal, non-sensitive example. Never attach API keys, personal documents, private paths, or unredacted logs."
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and a small public or invented input.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and GGO release version.
