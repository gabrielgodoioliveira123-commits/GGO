name: Python and Agent Skill checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate syntax and schema
        run: python scripts/validate_skill.py
      - name: Run portable offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify package release hashes
        run: python scripts/verify_package.py
      - name: Check reproducible release package
        run: python scripts/build_release.py --check
      - name: Verify estimate mode
        run: python scripts/god_prompt.py estimate --pages 10000 --words-per-page 500 --pages-per-txt 100
      - name: Verify offline readiness
        run: python scripts/god_prompt.py doctor
